[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iec-neutrons"
version = "0.1.0"
description = "Configurable OpenMC model for a cylindrical IEC D-T neutron source and moderators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy",
    "scipy",
    "h5py",
    "pycatima",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
iec-neutrons = "iec_neutrons.cli:main"
diamond-response = "diamond_response.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iec_neutrons = ["custom_source.cpp"]

[tool.pytest.ini_options]
markers = ["slow: runs OpenMC"]
testpaths = ["tests"]
