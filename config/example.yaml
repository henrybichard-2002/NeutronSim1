# All lengths are in cm; source and tally energies are in MeV.
source:
  radius_cm: 1.0
  height_cm: 35.0
  energy_mev: 14.1

geometry:
  cavity:
    radius_cm: 5.0
    height_cm: 40.0
  # Layers are listed inner to outer. Each cylinder must enclose the
  # previous cylinder; the resulting layer also forms an end cap.
  layers:
    - name: polyethylene
      radius_cm: 15.0
      height_cm: 40.0
      material: polyethylene
    - name: lead
      radius_cm: 20.0
      height_cm: 45.0
      material: lead
  world_radius_cm: 35.0

materials:
  polyethylene:
    density_g_cm3: 0.94
    elements:
      C: 2
      H: 4
    thermal_scattering:
      - c_H_in_CH2
  lead:
    density_g_cm3: 11.34
    elements:
      Pb: 1

settings:
  particles: 100000
  batches: 10
  inactive: 0
  seed: 12345

tally:
  energy_bins_mev: [0.0, 0.001, 0.01, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 14.2]

visualization:
  # Number of mesh voxels on each resolved axis. Each 2D view collapses the
  # remaining axis into one bin spanning the full spherical model boundary.
  mesh_bins: 100
